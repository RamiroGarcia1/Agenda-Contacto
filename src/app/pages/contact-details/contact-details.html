<div class="detalle-page">
    <a class="volver" routerLink="/contacts">Volver</a>

    <div class="detalle-card">
        <div class="avatar-grande">
            <svg viewBox="0 0 24 24" width="40" height="40" fill="currentColor">
                <path
                    d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
            </svg>
        </div>
        <h1>{{ contacto()?.firstName }} {{ contacto()?.lastName }}</h1>
        <p class="id-actual">ID actual: {{ id() }}</p>

        <div class="detalle-row">
            <span class="etiqueta">Teléfono</span>
            <span class="valor">{{ contacto()?.number }}</span>
        </div>
        <div class="detalle-row">
            <span class="etiqueta">Email</span>
            <span class="valor">{{ contacto()?.email }}</span>
        </div>
        <div class="detalle-row">
            <span class="etiqueta">Dirección</span>
            <span class="valor">{{ contacto()?.address }}</span>
        </div>

        @if (contacto()) {
            <a class="btn-editar-detalle" [routerLink]="['/contacts', contacto()!.id, 'edit']">Editar contacto</a>
            <button class="btn-eliminar-detalle" (click)="eliminarContacto(contacto()!.id)">Eliminar contacto</button>
        }
    </div>
</div>
