<header>
  <div>
    <a class="button" routerLink="/contacts">⬅</a>
    <h1>{{contacto?.FirstName}} {{contacto?.LastName}}</h1>
  </div>
  <button>Cerrar sesión</button>
</header>
<main class="card">
  <div>
    <p>Telefono</p>
    <p>{{contacto?.Number}}</p>
  </div>
  <div>
    <p>Email</p>
    <p>{{contacto?.Email}}</p>
  </div>
  <div>
    <p>Dirección</p>
    <p>{{contacto?.Adress}}</p>
  </div>
  @if(contacto){
    <div>
      <a class="button" [routerLink]="['/contacts',contacto.Id,'edit']">Editar</a>
      <button (click)="eliminarContacto(contacto.Id)">Eliminar</button>
    </div>
  }
</main>
