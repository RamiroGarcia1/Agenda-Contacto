<h1>Mis contactos</h1>

@for (contacto of contacts.contactList; track contacto.id) {
<div>
    <a [routerLink]="['/contacts', contacto.id]">
        <span>
            <img src="" alt="Foto del contacto">
        </span>
        <span>Nombre: {{contacto.nombre}}</span>
        <span>Telefono: {{contacto.telefono}}</span>
        <span>Dirección: {{contacto.direccion}}</span>
    </a>
</div>
}

<button (click)="contacts.agregarContacto()" [disabled]="contacts.contactList.length > 5">Agregar contacto</button>
