<header>
    <h1>Mis contactos</h1>
    <button>Cerrar sesión</button>
</header>

<main>
    <div class="contactos-lista">
        @for (contacto of contacts.contactList; track contacto.id) {
        <div class="contacto card">
            <a class="contacto-item" [routerLink]="['/contacts', contacto.id]">
                <span class="avatar">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                        <path
                            d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
                    </svg>
                </span>
                <span class="info">
                    <span class="nombre">{{ contacto.nombre }} {{ contacto.apellido }}</span>
                    <span class="telefono">{{ contacto.telefono }}</span>
                </span>
            </a>
            <div class="acciones">
                <button [routerLink]="['/contacts/edit', contacto.id]">Editar</button>
                <button (click)="eliminarContacto(contacto.id)">Eliminar</button>
            </div>
        </div>
        }
    </div>

    <a class="fab" routerLink="/contacts/create">+</a>
</main>
