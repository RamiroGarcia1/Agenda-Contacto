<div class="login-contenedor">
    <div class="login-tarjeta">
        <h1>Agenda Contactos</h1>

        <form (submit)="login($event)">
            <label for="email">Email</label>
            <input type="email" id="email" [formField]="formLogin.email">

            <label for="contraseña">Contraseña</label>
            <input type="password" id="contraseña" [formField]="formLogin.password">

            <button [disabled]="formLogin().invalid()">Iniciar Sesión</button>
        </form>

        <p>¿No tenés cuenta? <a routerLink="/register">Registrate</a></p>
    </div>
</div>
